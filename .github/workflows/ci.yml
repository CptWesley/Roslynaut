name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A hung process or debug session should not hold a runner for six hours.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      # The end-to-end tests load about a hundred projects into one server, each watched by an inotify instance of its own, and Ubuntu
      # allows 128 per user.
      - if: runner.os == 'Linux'
        run: sudo sysctl -w fs.inotify.max_user_instances=1024
      # The JIT host and the call counter target .NET 8.
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet test src/Roslynaut.Tests

  # A tag v1.2.3 publishes version 1.2.3 to nuget.org, through trusted publishing: no API key is stored. It also pushes the package
  # to GitHub Packages and attaches it to a GitHub release, both with the workflow's own token.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet pack src/Roslynaut -o artifacts -p:Version=${GITHUB_REF_NAME#v}
      - uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - run: dotnet nuget push artifacts/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
      # GitHub Packages links the package to this repository through its RepositoryUrl.
      - run: dotnet nuget push artifacts/*.nupkg --api-key ${{ secrets.GITHUB_TOKEN }} --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json --skip-duplicate
      # A tag made in GitHub's web interface comes with its release, which keeps its notes and gets the package. A pushed tag gets a
      # new release, a prerelease for a version with a suffix, such as v1.2.3-beta, as it is on nuget.org.
      - run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag --prerelease=${{ contains(github.ref_name, '-') }}
          gh release upload "$GITHUB_REF_NAME" artifacts/*.nupkg --clobber
        env:
          GH_TOKEN: ${{ github.token }}
